<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prüfung</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="wheel.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <button class="alt small" id="toggle">List</button>
    <h1>Who’s next?</h1>
    <div id="wheelWrap"><canvas id="wheel"></canvas><div id="pointer"></div></div>
    <div id="result">&nbsp;</div>
    <div class="btns">
      <button id="spin">Spin!</button>
      <button class="alt" id="reset">Everyone back in</button>
    </div>
  </div>
  <aside id="side">
    <h2>Names (<span id="count">0</span>)</h2>
    <p>Untick absent students. Space or Enter spins the wheel.</p>
    <div id="list"></div>
    <div class="opt">
      <label><input type="checkbox" id="removeDrawn" checked> Remove picked names</label>
      <button class="alt small" id="editBtn">Edit names</button>
    </div>
    <div id="editBox">
      <p>One name per line. Saved only in this presentation.</p>
      <textarea id="names" spellcheck="false"></textarea>
      <div class="btns"><button class="small" id="save">Save</button><button class="alt small" id="cancel">Cancel</button></div>
    </div>
  </aside>
</div>
