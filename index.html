<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who’s Next Wheel</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root { --bg:#3b2a1e; --paper:#f4ecd8; --navy:#1f2a44; --red:#8b1a1a; --line:#8b6f47; --grey:#555; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--navy);
    font-family:Garamond, "EB Garamond", Georgia, serif; overflow:hidden; }
  #app { display:flex; gap:2vmin; height:100%; padding:2vmin; }
  #stage { flex:1; position:relative; min-width:0; background:var(--paper); border:3px solid var(--line); border-radius:12px;
    display:flex; flex-direction:column; align-items:center; padding:1.5vmin; }
  h1 { margin:0; font-size:clamp(16px, 6vmin, 34px); }
  #wheelWrap { position:relative; flex:1; width:100%; min-height:0; display:flex; align-items:center; justify-content:center; }
  #pointer { position:absolute; top:50%; left:calc(50% + var(--r) - 14px); transform:translateY(-50%);
    width:0; height:0; border-top:calc(var(--r) * .09) solid transparent; border-bottom:calc(var(--r) * .09) solid transparent;
    border-right:calc(var(--r) * .17) solid var(--red); filter:drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  #result { font-size:clamp(18px, 8vmin, 44px); font-weight:bold; color:var(--red); min-height:1.25em; line-height:1.25; }
  .btns { display:flex; gap:12px; }
  button { font-family:inherit; font-size:clamp(13px, 4vmin, 22px); padding:.4em 1.1em; border-radius:8px;
    border:2px solid var(--line); background:var(--navy); color:#fff; cursor:pointer; }
  button.alt { background:var(--paper); color:var(--navy); }
  button.small { font-size:14px; padding:4px 10px; }
  button:disabled { opacity:.5; cursor:default; }
  #toggle { position:absolute; top:10px; right:12px; }
  #side { width:250px; background:var(--paper); border:3px solid var(--line); border-radius:12px; padding:12px;
    display:flex; flex-direction:column; gap:8px; min-height:0; }
  #side.hidden { display:none; }
  #side h2 { font-size:20px; margin:0; }
  #side p { font-size:14px; color:var(--grey); margin:0; }
  #list { flex:1; overflow:auto; min-height:0; }
  label { display:flex; align-items:center; gap:8px; font-size:17px; padding:1px 0; cursor:pointer; }
  #list label.out { color:var(--grey); text-decoration:line-through; }
  .opt { border-top:1px solid var(--line); padding-top:8px; display:flex; flex-direction:column; gap:8px; }
  #editBox { display:none; flex-direction:column; gap:6px; }
  #editBox.open { display:flex; }
  textarea { width:100%; height:160px; font:15px/1.3 inherit; font-family:inherit; border:1px solid var(--line);
    border-radius:6px; padding:6px; background:#fffdf6; resize:vertical; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <button class="alt small" id="toggle">List</button>
    <h1>Who’s next?</h1>
    <div id="wheelWrap"><canvas id="wheel"></canvas><div id="pointer"></div></div>
    <div id="result">&nbsp;</div>
    <div class="btns">
      <button id="spin">Spin!</button>
      <button class="alt" id="reset">Everyone back in</button>
    </div>
  </div>
  <aside id="side">
    <h2>Names (<span id="count">0</span>)</h2>
    <p>Untick absent students. Space or Enter spins the wheel.</p>
    <div id="list"></div>
    <div class="opt">
      <label><input type="checkbox" id="removeDrawn" checked> Remove picked names</label>
      <button class="alt small" id="editBtn">Edit names</button>
    </div>
    <div id="editBox">
      <p>One name per line. Saved only in this presentation.</p>
      <textarea id="names" spellcheck="false"></textarea>
      <div class="btns"><button class="small" id="save">Save</button><button class="alt small" id="cancel">Cancel</button></div>
    </div>
  </aside>
</div>
<script>
(function () {
  const COLORS = ["#1f2a44","#8b1a1a","#c9b48a","#4a5a7a","#b5651d","#6b7f5a"];
  const DEFAULT = { names: [], inactive: [], removeDrawn: true, sidebar: true };
  let state = structuredClone(DEFAULT);
  let inOffice = false;
  let angle = 0, spinning = false;

  const $ = id => document.getElementById(id);
  const canvas = $("wheel"), ctx = canvas.getContext("2d");

  // Names live in the add-in's document settings (saved inside the .pptx), never in this hosted code.
  function load() {
    let s = null;
    if (inOffice) s = Office.context.document.settings.get("zufallsrad");
    else { try { s = JSON.parse(localStorage.getItem("zufallsrad")); } catch (e) {} }
    if (s) state = Object.assign(structuredClone(DEFAULT), s);
  }
  function save() {
    if (inOffice) {
      Office.context.document.settings.set("zufallsrad", state);
      Office.context.document.settings.saveAsync(() => {});
    } else { try { localStorage.setItem("zufallsrad", JSON.stringify(state)); } catch (e) {} }
  }

  const active = () => state.names.filter(n => !state.inactive.includes(n));
  function rand() {
    try { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] / 4294967296; } catch (e) { return Math.random(); }
  }

  function size() {
    const wrap = $("wheelWrap");
    const d = Math.max(80, Math.min(wrap.clientWidth - 60, wrap.clientHeight - 8));
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.height = Math.round(d * dpr);
    canvas.style.width = canvas.style.height = d + "px";
    document.documentElement.style.setProperty("--r", d / 2 + "px");
    draw();
  }

  function draw() {
    const names = active(), n = names.length, R = canvas.width / 2;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.translate(R, R);
    if (!n) {
      ctx.fillStyle = "#555"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = `${R / 10}px Garamond, Georgia, serif`;
      ctx.fillText(state.names.length ? "No names left" : "Add names in the list", 0, 0);
      ctx.restore(); return;
    }
    const seg = 2 * Math.PI / n;
    const fs = Math.max(R / 22, Math.min(R / 11, (2 * R) / n));
    for (let i = 0; i < n; i++) {
      const a0 = angle + i * seg;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R * .985, a0, a0 + seg); ctx.closePath();
      let col = COLORS[i % COLORS.length];
      if (n % COLORS.length === 1 && i === n - 1) col = COLORS[2];
      ctx.fillStyle = col; ctx.fill();
      ctx.strokeStyle = "#f4ecd8"; ctx.lineWidth = R / 150; ctx.stroke();
      ctx.save(); ctx.rotate(a0 + seg / 2);
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillStyle = col === "#c9b48a" ? "#1f2a44" : "#fff";
      ctx.font = `bold ${fs}px Garamond, Georgia, serif`;
      ctx.fillText(names[i], R * .94, 0);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0, 0, R * .11, 0, 2 * Math.PI); ctx.fillStyle = "#f4ecd8"; ctx.fill();
    ctx.strokeStyle = "#8b6f47"; ctx.lineWidth = R / 90; ctx.stroke();
    ctx.restore();
  }

  // Pointer sits at angle 0 (right side).
  function winnerIndex(n) {
    const seg = 2 * Math.PI / n;
    const a = ((-angle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    return Math.floor(a / seg) % n;
  }

  function spin() {
    const names = active();
    if (spinning || !names.length) return;
    spinning = true; $("spin").disabled = true; $("result").innerHTML = "&nbsp;";
    const start = angle, total = (5 + rand() * 3) * 2 * Math.PI + rand() * 2 * Math.PI;
    const dur = 4200 + rand() * 1200, t0 = performance.now();
    (function step(t) {
      const p = Math.min(1, (t - t0) / dur);
      angle = start + total * (1 - Math.pow(1 - p, 4)); draw();
      if (p < 1) return requestAnimationFrame(step);
      angle %= 2 * Math.PI;
      const name = names[winnerIndex(names.length)];
      $("result").textContent = name;
      spinning = false; $("spin").disabled = false;
      if (state.removeDrawn) setTimeout(() => {
        if (spinning || state.inactive.includes(name)) return;
        state.inactive.push(name); save(); render();
      }, 1400);
    })(t0);
  }

  function render() {
    $("side").classList.toggle("hidden", !state.sidebar);
    $("removeDrawn").checked = state.removeDrawn;
    $("count").textContent = `${active().length}/${state.names.length}`;
    const list = $("list"); list.innerHTML = "";
    state.names.forEach(n => {
      const l = document.createElement("label"), cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = !state.inactive.includes(n);
      cb.onchange = () => {
        if (spinning) { cb.checked = !cb.checked; return; }
        state.inactive = cb.checked ? state.inactive.filter(x => x !== n) : [...state.inactive, n];
        save(); render();
      };
      l.classList.toggle("out", !cb.checked);
      l.append(cb, document.createTextNode(n)); list.append(l);
    });
    if (!state.names.length) openEdit();
    size();
  }
  function openEdit() { $("names").value = state.names.join("\n"); $("editBox").classList.add("open"); }

  $("spin").onclick = spin;
  $("toggle").onclick = () => { state.sidebar = !state.sidebar; save(); render(); };
  $("removeDrawn").onchange = e => { state.removeDrawn = e.target.checked; save(); };
  $("reset").onclick = () => { if (spinning) return; state.inactive = []; $("result").innerHTML = "&nbsp;"; save(); render(); };
  $("editBtn").onclick = openEdit;
  $("cancel").onclick = () => $("editBox").classList.remove("open");
  $("save").onclick = () => {
    const names = [...new Set($("names").value.split("\n").map(s => s.trim()).filter(Boolean))];
    state.names = names; state.inactive = state.inactive.filter(n => names.includes(n));
    $("editBox").classList.remove("open"); save(); render();
  };
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "TEXTAREA") return;
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); spin(); }
  });
  window.addEventListener("resize", size);

  function start() { load(); render(); }
  if (window.Office && Office.onReady) Office.onReady(info => { inOffice = !!info.host; start(); });
  else start();
})();
</script>
</body>
</html>
